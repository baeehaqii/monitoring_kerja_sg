name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check SSH connectivity
        run: |
          echo "Runner public IP: $(curl -s https://api.ipify.org)"
          nc -zv -w 10 ${{ secrets.PROD_SSH_HOST }} ${{ secrets.PROD_SSH_PORT }} 2>&1 \
            && echo "✅ Port ${{ secrets.PROD_SSH_PORT }} OPEN" \
            || echo "❌ Port ${{ secrets.PROD_SSH_PORT }} REFUSED/CLOSED – cek aaPanel Security"

      - name: Deploy to Server Kantor (task.siproper.com)
        uses: appleboy/ssh-action@v1.2.0
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          port: ${{ secrets.PROD_SSH_PORT }}
          timeout: 60s
          command_timeout: 30m
          envs: GH_TOKEN
          script: |
            set -e

            PROJECT_DIR="/www/wwwroot/monitoring_kerja_sg"
            DEPLOY_USER="$(whoami)"

            echo "==> Fixing ownership to $DEPLOY_USER..."
            sudo chown -R ${DEPLOY_USER}:${DEPLOY_USER} $PROJECT_DIR

            cd $PROJECT_DIR

            echo "==> Pulling latest code..."
            git config --global --add safe.directory $PROJECT_DIR
            git fetch https://x-access-token:${GH_TOKEN}@github.com/baeehaqii/monitoring_kerja_sg.git main
            git reset --hard FETCH_HEAD

            echo "==> Installing dependencies..."
            npm install --frozen-lockfile --cache /tmp/npm-cache-deploy

            echo "==> Generating Prisma client..."
            npx prisma generate

            echo "==> Running database migrations..."
            npx prisma migrate deploy

            echo "==> Building Next.js app..."
            npm run build

            echo "==> Restarting app..."

            # Fix ownership ke www agar app bisa baca file build
            sudo chown -R www:www $PROJECT_DIR
            mkdir -p $PROJECT_DIR/logs

            # Cari PM2 binary (aaPanel Node Project menggunakan PM2 internaly)
            PM2_BIN=$(sudo -u www which pm2 2>/dev/null || true)
            if [ -z "$PM2_BIN" ]; then
              for candidate in \
                "/www/server/nodejs/v24.11.0/bin/pm2" \
                "/www/server/nvm/versions/node/v24.11.0/bin/pm2" \
                "/usr/local/bin/pm2" \
                "/usr/bin/pm2"; do
                [ -x "$candidate" ] && PM2_BIN="$candidate" && break
              done
            fi

            # Matikan proses lama — coba via PM2 dulu, lalu force kill port
            if [ -n "$PM2_BIN" ]; then
              echo "==> Using PM2 at: $PM2_BIN"
              sudo -u www $PM2_BIN stop monitoring_kerja_sg 2>/dev/null || true
              sudo -u www $PM2_BIN delete monitoring_kerja_sg 2>/dev/null || true
            fi
            sudo fuser -k 3003/tcp 2>/dev/null || true
            sudo pkill -f "next-server" 2>/dev/null || true
            sleep 3

            # Start via PM2 jika tersedia (aaPanel mechanism), fallback ke nohup
            STARTED=false
            if [ -n "$PM2_BIN" ]; then
              sudo -u www $PM2_BIN start $PROJECT_DIR/ecosystem.config.js 2>/dev/null \
                && STARTED=true \
                || echo "⚠️  PM2 start gagal, coba nohup..."
              sudo -u www $PM2_BIN save --force 2>/dev/null || true
            fi

            if [ "$STARTED" = false ]; then
              echo "==> Starting via nohup..."
              sudo -u www bash -c "cd $PROJECT_DIR && nohup npm start >> $PROJECT_DIR/logs/app.log 2>&1 &"
            fi

            sleep 8

            ss -tlnp | grep -q ':3003' \
              && echo "✅ App listening on port 3003" \
              || echo "❌ App gagal start — cek logs: $PROJECT_DIR/logs/"

            echo "==> Deploy complete!"
