name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check SSH connectivity
        run: |
          echo "Runner public IP: $(curl -s https://api.ipify.org)"
          nc -zv -w 10 ${{ secrets.PROD_SSH_HOST }} ${{ secrets.PROD_SSH_PORT }} 2>&1 \
            && echo "✅ Port ${{ secrets.PROD_SSH_PORT }} OPEN" \
            || echo "❌ Port ${{ secrets.PROD_SSH_PORT }} REFUSED/CLOSED – cek aaPanel Security"

      - name: Deploy to Server Kantor (task.siproper.com)
        uses: appleboy/ssh-action@v1.2.0
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          port: ${{ secrets.PROD_SSH_PORT }}
          timeout: 60s
          command_timeout: 30m
          envs: GH_TOKEN
          script: |
            set -e

            PROJECT_DIR="/www/wwwroot/monitoring_kerja_sg"
            DEPLOY_USER="$(whoami)"

            echo "==> Fixing ownership to $DEPLOY_USER..."
            sudo chown -R ${DEPLOY_USER}:${DEPLOY_USER} $PROJECT_DIR

            cd $PROJECT_DIR

            echo "==> Pulling latest code..."
            git config --global --add safe.directory $PROJECT_DIR
            git fetch https://x-access-token:${GH_TOKEN}@github.com/baeehaqii/monitoring_kerja_sg.git main
            git reset --hard FETCH_HEAD

            echo "==> Installing dependencies..."
            npm install --frozen-lockfile --cache /tmp/npm-cache-deploy

            echo "==> Generating Prisma client..."
            npx prisma generate

            echo "==> Running database migrations..."
            npx prisma migrate deploy

            echo "==> Building Next.js app..."
            npm run build

            echo "==> Preparing restart script..."
            sudo chown -R www:www $PROJECT_DIR
            sudo -u www mkdir -p $PROJECT_DIR/logs

            # Tulis restart script ke disk — selalu exit 0, tidak ada yang bisa fail deploy
            sudo tee /tmp/do_restart.sh > /dev/null << 'RESTART'
            #!/bin/bash
            PROJECT="/www/wwwroot/monitoring_kerja_sg"

            # 1. Stop PM2 managed instance dulu agar tidak autorestart setelah port dikill
            /usr/bin/pm2 stop monitoring_kerja_sg 2>/dev/null || true

            # 2. Tunggu sebentar sebelum force kill
            sleep 1

            # 3. Force kill semua proses di port 3003
            /sbin/fuser -k 3003/tcp 2>/dev/null || true
            /usr/bin/pkill -f "next-server" 2>/dev/null || true
            /usr/bin/pkill -f "next start" 2>/dev/null || true
            sleep 3

            # 4. Start via nohup sebagai www (mekanisme yang sama dengan aaPanel)
            cd "$PROJECT"
            nohup npm start >> "$PROJECT/logs/app.log" 2>&1 &
            APP_PID=$!
            echo "$APP_PID" > "$PROJECT/logs/app.pid"
            echo "App started, PID: $APP_PID"

            exit 0
            RESTART

            sudo chmod +x /tmp/do_restart.sh

            echo "==> Restarting app..."
            sudo -u www bash /tmp/do_restart.sh

            sleep 8

            if ss -tlnp | grep -q ':3003'; then
              PID=$(cat $PROJECT_DIR/logs/app.pid 2>/dev/null || echo "?")
              echo "✅ App listening on port 3003 (PID: $PID)"
            else
              echo "❌ App gagal start — last 20 lines log:"
              sudo -u www tail -20 $PROJECT_DIR/logs/app.log 2>/dev/null || true
            fi

            echo "==> Deploy complete!"
